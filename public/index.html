<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chore Tracker</title>
  <meta name="theme-color" content="#5b6cf9" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Chores" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login view -->
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card">
      <div class="login-emoji">🏠</div>
      <h1>Chore Tracker</h1>
      <p class="subtitle">Sign in to see the household chores</p>
      <input
        type="text"
        id="login-username"
        placeholder="Username"
        autocomplete="username"
        required
      />
      <input
        type="password"
        id="login-password"
        placeholder="Password"
        autocomplete="current-password"
        required
      />
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>

  <!-- Main app view -->
  <div id="app-view" class="app" hidden>
    <header class="app-header">
      <div class="title-block">
        <h1>🏠 Chore Tracker</h1>
        <p id="today-label" class="subtitle"></p>
      </div>
      <div class="overall-progress">
        <svg viewBox="0 0 44 44" class="progress-ring">
          <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
          <circle id="ring-fill" class="ring-fill" cx="22" cy="22" r="19"></circle>
        </svg>
        <span id="progress-text" class="progress-text">0%</span>
      </div>
    </header>

    <div class="session-bar">
      <span class="signed-in">
        <span id="me-avatar" class="user-avatar"></span>
        <span id="me-name"></span>
      </span>
      <button id="logout-btn" class="btn btn-ghost">Sign out</button>
    </div>

    <form id="add-chore-form" class="add-chore-form">
      <input
        type="text"
        id="chore-name"
        placeholder="Add a chore… (e.g. Take out trash)"
        maxlength="60"
        autocomplete="off"
      />
      <select id="chore-freq">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <main id="chore-sections"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
